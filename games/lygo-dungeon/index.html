    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="1280" height="720" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/LYGODungeon.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/LYGODungeon.data.unityweb",
        frameworkUrl: buildUrl + "/LYGODungeon.framework.js.unityweb",
        codeUrl: buildUrl + "/LYGODungeon.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "LYGO Lattice",
        productName: "LYGO Dungeon Adventures",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        autoSyncPersistentDataPath: true,
        // Percentage canvas CSS makes Unity resize the drawing buffer forever
        // (Maximum call stack size exceeded). Keep the style size in pixels.
        devicePixelRatio: 1
      };

      function fitCanvas() {
        var w = Math.max(320, window.innerWidth | 0);
        var h = Math.max(240, (window.innerHeight - 86) | 0);
        var width = w + "px";
        var height = h + "px";
        if (canvas.style.width === width && canvas.style.height === height) return;
        canvas.style.width = width;
        canvas.style.height = height;
      }

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }
      fitCanvas();
      window.addEventListener("resize", fitCanvas);

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>

<script src="radio.js?v=1"></script>
<script>if (window.HavenRadio && HavenRadio.pause) HavenRadio.pause();</script>
<script>
    (function () {
      var voices = [];
      var readingVoices = false;
      var maleNames = ["Google UK English Male", "Microsoft Guy", "Microsoft David", "Daniel", "Alex", "Microsoft Mark"];
      var femaleNames = ["Google UK English Female", "Microsoft Aria", "Microsoft Zira", "Samantha", "Victoria", "Microsoft Jenny"];
      function loadVoices() {
        if (readingVoices || !window.speechSynthesis) return voices;
        readingVoices = true;
        try { voices = speechSynthesis.getVoices() || []; }
        finally { readingVoices = false; }
        return voices;
      }
      if (window.speechSynthesis) {
        loadVoices();
        speechSynthesis.addEventListener("voiceschanged", function () {
          if (!readingVoices) loadVoices();
        });
      }
      function named(list, names) {
        for (var i = 0; i < names.length; i++) {
          var needle = names[i].toLowerCase();
          for (var j = 0; j < list.length; j++) {
            if ((list[j].name || "").toLowerCase().indexOf(needle) !== -1) return list[j];
          }
        }
        return null;
      }
      function pick(female) {
        var list = voices.length ? voices : loadVoices();
        var voice = named(list, female ? femaleNames : maleNames);
        if (voice) return voice;
        var hint = female ? /female|woman|aria|zira|samantha|victoria|jenny/i : /male|david|guy|daniel|\balex\b|mark/i;
        for (var i = 0; i < list.length; i++) {
          if (hint.test(list[i].name || "") && /^en/i.test(list[i].lang || "en")) return list[i];
        }
        return null;
      }
      var ducked = false;
      function duck(on) {
        var audio = document.getElementById("radioEl");
        if (!audio) return;
        if (on) {
          var base = window.HavenRadio && HavenRadio.vol ? HavenRadio.vol() : audio.volume;
          audio.volume = Math.max(0, base * 0.15);
          ducked = true;
        } else if (ducked) {
          audio.volume = window.HavenRadio && HavenRadio.vol ? HavenRadio.vol() : 0.5;
          ducked = false;
        }
      }
      window.lygoSpeak = function (text, female) {
        if (!text || !window.speechSynthesis) return;
        var woman = female === true || female === 1 || female === "1";
        try {
          var u = new SpeechSynthesisUtterance(String(text));
          var voice = pick(woman);
          if (voice) {
            u.voice = voice;
            u.lang = voice.lang || "en-GB";
            u.pitch = 1;
            u.rate = 0.96;
          } else {
            u.lang = woman ? "en-GB" : "en-GB";
            u.pitch = woman ? 1.12 : 0.82;
            u.rate = woman ? 0.96 : 0.92;
          }
          u.onend = function () { duck(false); };
          u.onerror = function () { duck(false); };
          speechSynthesis.cancel();
          if (speechSynthesis.paused) speechSynthesis.resume();
          duck(true);
          speechSynthesis.speak(u);
          setTimeout(function () {
            if (speechSynthesis.paused) speechSynthesis.resume();
          }, 80);
        } catch (err) {
          duck(false);
        }
      };
    })();
</script>

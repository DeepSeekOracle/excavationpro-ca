<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0646320966060599"
     crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lattice Golf: Live hall | Excavationpro</title>
<meta name="description" content="Live Lattice Golf hall. Public rounds: names, totals, vs par. Empty beats a fake board.">
<link rel="canonical" href="https://excavationpro.ca/games/lattice-golf/ledger.html">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/games/hub.css?v=5">
<style>
body { margin:0; background:#07140c; color:#e8f5ec; font-family:"Source Sans 3",system-ui,sans-serif; }
.wrap { max-width:820px; margin:0 auto; padding:1.4rem 1.1rem 3rem; }
.kicker { letter-spacing:.2em; text-transform:uppercase; color:#5eead4; font-size:.72rem; }
h1 { font-family:Syne,sans-serif; }
a { color:#5eead4; }
.row { display:flex; gap:.5rem; flex-wrap:wrap; margin:1rem 0; }
.btn { display:inline-flex; padding:.5rem .8rem; border:1px solid #1e4a32; border-radius:8px; text-decoration:none; color:#e8f5ec; }
.muted { color:#94a3b8; }
.round {
  width:100%; text-align:left; background:#0c1c12; color:#e8f5ec; border:1px solid #1e4a32;
  border-radius:10px; padding:.7rem .8rem; margin:.4rem 0 0; font:inherit;
}
.rtop { display:flex; justify-content:space-between; gap:.6rem; flex-wrap:wrap; }
.rtop b { font-family:Syne,sans-serif; }
.rmeta { color:#94a3b8; font-size:.82rem; }
.rmeta b { color:#fbbf24; }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">Δ9Φ963 · live hall</p>
  <h1>Lattice Golf ledger</h1>
  <p class="muted">Public rounds. Set a name on the title screen. Totals only on the wire, hole cards stay in this browser.</p>
  <div class="row">
    <a class="btn" href="./">Play</a>
    <a class="btn" href="/games/">Hub</a>
    <a class="btn" href="https://www.paypal.com/paypalme/ExcavationPro" rel="noopener">PayPal</a>
  </div>
  <p class="muted" id="srcMeta">Loading live hall…</p>
  <div id="hall"></div>
</div>
<script>
(function(){
  function vs(n){ if (n==null || n===0) return "E"; return n>0 ? "+"+n : String(n); }
  function esc(s){ return String(s||"").replace(/[<>]/g,""); }
  var FEEDS = [
    "https://deepseekoracle-lattice-marines-ledger.hf.space/golf/ledger.json",
    "https://huggingface.co/datasets/DeepSeekOracle/lattice-marines-wins/resolve/main/lattice-golf.json",
    "./ledger.json"
  ];
  async function pull(){
    var rows = [];
    var src = "this browser";
    for (var i=0;i<FEEDS.length;i++){
      try {
        var r = await fetch(FEEDS[i], { cache:"no-store" });
        if (!r.ok) continue;
        var data = await r.json();
        if (data && Array.isArray(data.rounds)) {
          rows = data.rounds.slice();
          src = FEEDS[i].replace(/^https?:\/\//,"");
          break;
        }
      } catch(e) {}
    }
    try {
      var s = JSON.parse(localStorage.getItem("lygo-lattice-golf-v1") || "{}");
      var q = JSON.parse(localStorage.getItem("lygo-lattice-golf-ledger-q") || "[]");
      rows = rows.concat(s.rounds || []).concat(q);
    } catch(e) {}
    var seen = {};
    rows = rows.filter(function(r){
      var k = [r.name, r.course, r.total, r.vsPar, r.date||r.at||""].join("|");
      if (seen[k]) return false;
      seen[k] = 1;
      return true;
    }).sort(function(a,b){
      var av = a.vsPar, bv = b.vsPar;
      if (av==null) av = 99; if (bv==null) bv = 99;
      return av - bv || (a.total||99) - (b.total||99);
    });
    document.getElementById("srcMeta").textContent = rows.length + " rounds · " + src;
    var hall = document.getElementById("hall");
    if (!rows.length) {
      hall.innerHTML = "<p class='muted'>No rounds yet. Close a card to cut the first line.</p>";
      return;
    }
    hall.innerHTML = rows.map(function(r){
      return "<div class='round'><div class='rtop'><b>"+esc(r.course||r.mode)+"</b><span>"+esc(r.date||"")+"</span></div>"+
        "<div class='rmeta'>"+esc(r.name||"Operator")+" · "+(r.holes||"?")+" holes"+
        (r.par ? " · par "+r.par : "")+
        " · <b>"+(r.total||", ")+" · "+vs(r.vsPar)+"</b></div></div>";
    }).join("");
  }
  pull();
})();
</script>
</body>
</html>

<body>
<div id="boot" class="boot">
  <p class="kicker">Δ9Φ963 · Excavationpro</p>
  <h1>Stock Market Masters</h1>
  <p class="boot-msg">Opening the quotation floor…</p>
</div>

<div id="app" class="app hidden">
  <header class="top">
    <a class="brand" href="/">excavationpro.ca</a>
    <a class="games-mini" href="/games/">All games</a>
    <div class="phase-pill" id="phasePill">TRADE</div>
    <div class="res" id="resHud"></div>
    <a class="paypal-mini" href="https://www.paypal.com/paypalme/ExcavationPro" target="_blank" rel="noopener noreferrer">PayPal</a>
  </header>
  <div class="stage">
    <div class="quote" id="board"></div>
    <aside class="rail">
      <div class="bank" id="bank"></div>
      <div class="machines" id="machines"></div>
      <div class="players" id="players"></div>
    </aside>
  </div>
  <footer class="dock">
    <button type="button" class="btn ghost" id="btnHelp">How to play</button>
    <button type="button" class="btn ghost" id="btnMenu">Floor / menu</button>
    <span class="grow" id="dockStatus"></span>
    <div id="radioDock" class="radio-dock collapsed">
      <audio id="radioEl" preload="none"></audio>
      <div class="radio-chip">
        <button type="button" id="radioView" title="Show or hide radio (music keeps playing)">Radio</button>
        <button type="button" id="radioMute" title="Mute radio (does not stop playback)">Mute</button>
      </div>
      <div class="radio-panel" id="radioPanel">
        <div class="radio-head">
          <strong>Listen portal radio</strong>
          <a href="https://asiancoastline.com/listen.html" target="_blank" rel="noopener">Free listen portal</a>
          <p class="radio-dsp">
            <a href="https://ffm.to/eovnvo9" target="_blank" rel="noopener noreferrer">Stream Excavationpro</a>
            · <a href="https://open.spotify.com/artist/6CkZ4bN2xu3WRKbjEL3u2S" target="_blank" rel="noopener noreferrer">Spotify</a>
            · <a href="https://music.apple.com/us/artist/excavationpro/1586588545" target="_blank" rel="noopener noreferrer">Apple Music</a>
            · <a href="https://music.youtube.com/channel/UCnCf9gjhMEfUFPvGkdlUabQ" target="_blank" rel="noopener noreferrer">YouTube Music</a>
          </p>
        </div>
        <div class="radio-title" id="radioTitle">Idle, press Play for Excavationpro radio</div>
        <div class="radio-row">
          <button type="button" id="radioPlay">Play</button>
          <button type="button" id="radioNext">Next</button>
          <label class="radio-vol">Vol <input id="radioVol" type="range" min="0" max="100" value="55"></label>
        </div>
      </div>
    </div>
    <div class="auto-box" id="autoBox">
      <button type="button" class="btn ghost" id="btnAuto" title="Roll automatically so you do not have to click each turn">Auto</button>
      <button type="button" class="spd" data-spd="slow">Slow</button>
      <button type="button" class="spd" data-spd="med">Med</button>
      <button type="button" class="spd" data-spd="fast">Fast</button>
    </div>
    <a class="games-mini" href="/games/">All games</a>
    <a class="disc-link" href="./disclaimer.html">Disclaimer</a>
    <a class="btn donate" href="https://www.paypal.com/paypalme/ExcavationPro" target="_blank" rel="noopener noreferrer" title="PayPal.me/ExcavationPro">Donate · PayPal</a>
    <button type="button" class="btn" id="btnCash">Cash out</button>
    <button type="button" class="btn gold" id="btnSpin">Roll both dice</button>
  </footer>
</div>

<div id="overlay" class="overlay"></div>

<script src="./radio.js"></script>
<script src="./game.js?v=1"></script>
</body>
</html>

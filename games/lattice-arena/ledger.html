<body>
<div class="wrap">
  <p class="kicker">Δ9Φ963 · live hall</p>
  <h1>LYGO Arena ledger</h1>
  <p class="muted">One line per player and lineup. The hall stores the name, the kits, the mode, and the wins and losses. Empty beats a fake board.</p>
  <div class="row">
    <a class="btn" href="./">Play</a>
    <a class="btn" href="./whitepaper.html">Whitepaper</a>

    <a class="btn" href="https://www.paypal.com/paypalme/ExcavationPro" rel="noopener">PayPal</a>
  </div>
  <p class="muted" id="srcMeta">Loading…</p>
  <h2>This browser</h2>
  <div id="mine"></div>
  <h2>Hall</h2>
  <div id="hall"></div>
</div>
<script>
(function(){
  function esc(s){ return String(s||"").replace(/[<>]/g,""); }
  var FEEDS = [
    "https://huggingface.co/datasets/DeepSeekOracle/lattice-marines-wins/resolve/main/arcade.json",
    "https://deepseekoracle-lattice-marines-ledger.hf.space/arcade.json",
    "https://deepseekoracle-lattice-marines-ledger.hf.space/arena/ledger.json"
  ];
  function fromFeed(data){
    if (!data) return [];
    if (data.books && data.books["lattice-arena"]) {
      var book = data.books["lattice-arena"];
      return book.rows || book.standings || [];
    }
    if (Array.isArray(data.standings)) return data.standings;
    if (Array.isArray(data.rows)) return data.rows;
    return [];
  }
  function localLines(){
    var out = [];
    try {
      var s = JSON.parse(localStorage.getItem("lygo_lattice_arena_v1") || "{}");
      var books = s.books || {};
      Object.keys(books).forEach(function(k){
        var b = books[k];
        if (!(b.wins || b.losses)) return;
        out.push({
          name: s.name || "You",
          wins: b.wins || 0,
          losses: b.losses || 0,
          mode: b.mode || k.split("|")[0],
          team: (b.names || []).join(" · "),
          date: "this browser"
        });
      });
      if (s.tvBest && s.tvBest.wins) {
        out.push({
          name: "Battle TV",
          wins: s.tvBest.wins,
          losses: 0,
          mode: "record",
          team: s.tvBest.team || "",
          date: "best reign on this browser"
        });
      }
    } catch (e) {}
    return out.sort(function(a,b){ return (b.wins||0)-(a.wins||0); });
  }
  async function pull(){
    var rows = [], src = "this browser";
    for (var i=0;i<FEEDS.length;i++){
      try {
        var r = await fetch(FEEDS[i], { cache:"no-store" });
        if (!r.ok) continue;
        var list = fromFeed(await r.json()).filter(function(row){ return !row.game || row.game === "lattice-arena"; });
        if (list && list.length) { rows = list.slice(); src = FEEDS[i].replace(/^https?:\/\//,""); break; }
      } catch(e) {}
    }
    var mine = localLines();
    document.getElementById("srcMeta").textContent = rows.length ? ("Showing " + rows.length + " lineup" + (rows.length===1?"":"s") + " · " + src) : "Hall is empty, a real zero.";
    document.getElementById("mine").innerHTML = mine.slice(0, 12).map(card).join("") || "<p class='muted'>No named lineups in this browser yet.</p>";
    var sorted = rows.slice().sort(function(a,b){ return (b.wins||0)-(a.wins||0) || (a.losses||0)-(b.losses||0); });
    document.getElementById("hall").innerHTML = sorted.slice(0,40).map(card).join("") || "<p class='muted'>No lineup has been posted yet. Name yourself, finish a fight, and the line lands here.</p>";
  }
  function card(r){
    var wins = r.wins != null ? r.wins : (r.score || 0);
    var losses = r.losses != null ? r.losses : 0;
    return "<div class='round'><div class='rtop'><b>"+esc(r.name||"Spectator")+"</b><span>"+esc(wins)+"W / "+esc(losses)+"L</span></div>"+
      "<div class='rmeta'>"+(r.mode?("<b>"+esc(r.mode)+"</b> · "):"")+(r.team?esc(r.team)+" · ":"")+(r.mvp?("last MVP <b>"+esc(r.mvp)+"</b> · "):"")+esc(r.date||"")+"</div></div>";
  }
  pull();
  setInterval(pull, 40000);
})();
</script>

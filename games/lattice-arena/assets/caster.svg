<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="320" height="340" role="img" aria-label="The arena caster: a medieval herald calling the fight">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#1b2436"/>
      <stop offset="70%" stop-color="#0b101c"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="tabard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d9bb"/>
      <stop offset="100%" stop-color="#d9a879"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="scroll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d6c39a"/>
    </linearGradient>
  </defs>

  <rect width="320" height="340" fill="url(#bg)"/>
  <!-- the pennants of the two camps, hung behind the box -->
  <g opacity="0.5">
    <path d="M18 8 L52 8 L52 46 L35 34 L18 46 Z" fill="#22d3ee" opacity="0.5"/>
    <path d="M268 8 L302 8 L302 46 L285 34 L268 46 Z" fill="#f87171" opacity="0.5"/>
  </g>

  <!-- the caster's shoulders and tabard -->
  <path d="M44 340 L52 268 C58 232 86 214 118 206 L202 206 C234 214 262 232 268 268 L276 340 Z" fill="url(#tabard)" stroke="#7c2d12" stroke-width="2"/>
  <!-- chevron + the arena mark -->
  <path d="M118 244 L160 274 L202 244 L202 268 L160 298 L118 268 Z" fill="#0b101c" opacity="0.55"/>
  <path d="M152 214 L160 200 L168 214 L160 228 Z" fill="#fde68a" stroke="#7c2d12" stroke-width="1.5"/>
  <!-- a mail collar -->
  <g fill="#94a3b8" opacity="0.65">
    <circle cx="120" cy="222" r="4"/><circle cx="134" cy="216" r="4"/><circle cx="148" cy="212" r="4"/>
    <circle cx="160" cy="211" r="4"/><circle cx="172" cy="212" r="4"/><circle cx="186" cy="216" r="4"/>
    <circle cx="200" cy="222" r="4"/>
  </g>

  <!-- neck -->
  <rect x="142" y="176" width="36" height="40" rx="12" fill="#c08b5c"/>

  <!-- head -->
  <ellipse cx="160" cy="132" rx="50" ry="58" fill="url(#skin)"/>
  <!-- ears -->
  <ellipse cx="110" cy="134" rx="9" ry="13" fill="#e0b183"/>
  <ellipse cx="210" cy="134" rx="9" ry="13" fill="#e0b183"/>

  <!-- the beard of a man who has called a thousand of these -->
  <path d="M112 138 C112 190 132 214 160 214 C188 214 208 190 208 138 C196 176 180 186 160 186 C140 186 124 176 112 138 Z" fill="#9ca3af"/>
  <path d="M132 186 C142 196 178 196 188 186 C182 202 138 202 132 186 Z" fill="#6b7280" opacity="0.7"/>

  <!-- open mouth, mid-call -->
  <ellipse cx="160" cy="180" rx="15" ry="11" fill="#3f1420"/>
  <path d="M150 178 C156 172 164 172 170 178 C165 176 155 176 150 178 Z" fill="#f4f4f5"/>
  <ellipse cx="160" cy="187" rx="8" ry="5" fill="#b91c1c" opacity="0.8"/>

  <!-- brows: one up, one down. He has seen something. -->
  <path d="M126 106 C136 98 150 98 158 104" stroke="#6b7280" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M162 100 C172 94 188 96 196 106" stroke="#6b7280" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="138" cy="120" rx="11" ry="9" fill="#f8fafc"/>
  <ellipse cx="182" cy="120" rx="11" ry="9" fill="#f8fafc"/>
  <circle cx="140" cy="121" r="5" fill="#1e293b"/>
  <circle cx="180" cy="121" r="5" fill="#1e293b"/>
  <circle cx="142" cy="118" r="1.8" fill="#f8fafc"/>
  <circle cx="182" cy="118" r="1.8" fill="#f8fafc"/>

  <!-- the cap, with a feather he is very proud of -->
  <path d="M106 104 C106 76 130 56 160 56 C190 56 214 76 214 104 C196 92 178 86 160 86 C142 86 124 92 106 104 Z" fill="#7c2d12"/>
  <path d="M104 102 C118 92 176 92 216 102 C200 110 120 110 104 102 Z" fill="#b45309"/>
  <path d="M200 74 C232 52 250 62 246 84 C240 104 216 104 206 92" fill="#dc2626" opacity="0.9"/>
  <path d="M206 92 C216 104 240 104 246 84" stroke="#7f1d1d" stroke-width="2" fill="none"/>

  <!-- the horn he calls through, held to his mouth -->
  <g transform="translate(196,150) rotate(-16)">
    <path d="M0 0 L58 -18 L58 22 L0 6 Z" fill="url(#horn)" stroke="#78350f" stroke-width="2"/>
    <ellipse cx="58" cy="2" rx="7" ry="21" fill="#fbbf24" stroke="#78350f" stroke-width="2"/>
    <rect x="-16" y="-4" width="18" height="12" rx="4" fill="#78350f"/>
  </g>
  <path d="M206 214 C214 196 220 190 226 186" stroke="#c08b5c" stroke-width="13" fill="none" stroke-linecap="round"/>
  <circle cx="228" cy="184" r="10" fill="#e0b183"/>

  <!-- the scroll: the book, the ledger, the names -->
  <g transform="translate(52,190) rotate(8)">
    <rect x="0" y="0" width="54" height="74" rx="4" fill="url(#scroll)" stroke="#a16207" stroke-width="2"/>
    <g stroke="#78350f" stroke-width="2" opacity="0.6">
      <line x1="8" y1="14" x2="46" y2="14"/><line x1="8" y1="26" x2="46" y2="26"/>
      <line x1="8" y1="38" x2="40" y2="38"/><line x1="8" y1="50" x2="44" y2="50"/>
      <line x1="8" y1="62" x2="30" y2="62"/>
    </g>
    <circle cx="27" cy="0" r="7" fill="#e7d3a8" stroke="#a16207" stroke-width="2"/>
    <circle cx="27" cy="74" r="7" fill="#e7d3a8" stroke="#a16207" stroke-width="2"/>
  </g>
  <path d="M92 236 C84 224 80 216 78 208" stroke="#c08b5c" stroke-width="13" fill="none" stroke-linecap="round"/>
  <circle cx="77" cy="205" r="10" fill="#e0b183"/>

  <!-- the sand he is calling from, and a gold frame -->
  <path d="M0 340 L320 340 L320 322 C240 336 80 336 0 322 Z" fill="#fde68a" opacity="0.12"/>
  <rect x="3" y="3" width="314" height="334" rx="10" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.55"/>
  <g fill="#fbbf24" opacity="0.7">
    <circle cx="16" cy="16" r="2.5"/><circle cx="304" cy="16" r="2.5"/>
    <circle cx="16" cy="324" r="2.5"/><circle cx="304" cy="324" r="2.5"/>
  </g>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0646320966060599"
     crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haven Rally: Live hall | Excavationpro</title>
<meta name="description" content="Live Haven Rally hall. Circuit times and endless scores from every player. Names and match metadata only.">
<link rel="canonical" href="https://excavationpro.ca/games/haven-rally/ledger.html">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/games/hub.css?v=5">
<style>
body { margin:0; background:#070b12; color:#e8eef5; font-family:"Source Sans 3",system-ui,sans-serif; }
.wrap { max-width:820px; margin:0 auto; padding:1.4rem 1.1rem 3rem; }
.kicker { letter-spacing:.2em; text-transform:uppercase; color:#5eead4; font-size:.72rem; }
h1,h2 { font-family:Syne,sans-serif; }
h2 { font-size:1.15rem; color:#fbbf24; margin:1.6rem 0 .4rem; }
a { color:#5eead4; }
.row { display:flex; gap:.5rem; flex-wrap:wrap; margin:1rem 0; }
.btn { display:inline-flex; padding:.5rem .8rem; border:1px solid #1e3a4a; border-radius:8px; text-decoration:none; color:#e8eef5; }
.muted { color:#94a3b8; }
.round {
  width:100%; text-align:left; background:#0c1622; color:#e8eef5; border:1px solid #1e3a4a;
  border-radius:10px; padding:.7rem .8rem; margin:.4rem 0 0; font:inherit;
}
.rtop { display:flex; justify-content:space-between; gap:.6rem; flex-wrap:wrap; }
.rtop b { font-family:Syne,sans-serif; color:#fbbf24; }
.gold { color:#fbbf24; }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">Δ9Φ963 · live hall</p>
  <h1>Haven Rally ledger</h1>
  <p class="muted">Public heats and endless scores. Set a name on the title screen. Empty beats a fake board.</p>
  <div class="row">
    <a class="btn" href="./">Play</a>
    <a class="btn" href="./whitepaper.html">Whitepaper</a>
    <a class="btn" href="/games/">Hub</a>
    <a class="btn" href="https://www.paypal.com/paypalme/ExcavationPro" rel="noopener">PayPal</a>
  </div>
  <p class="muted" id="srcMeta">Loading live hall…</p>
  <div id="arcade"></div>
  <div id="hall"></div>
</div>
<script>
(function(){
  function fmt(ms){
    if (ms==null || !isFinite(ms) || ms < 1) return ", ";
    var s=ms/1000, m=Math.floor(s/60), r=s-m*60;
    return m+":"+r.toFixed(3).padStart(6,"0");
  }
  function esc(s){ return String(s||"").replace(/[<>]/g,""); }
  var FEEDS = [
    "https://deepseekoracle-lattice-marines-ledger.hf.space/rally/ledger.json",
    "https://huggingface.co/datasets/DeepSeekOracle/lattice-marines-wins/resolve/main/haven-rally.json",
    "./ledger.json"
  ];
  function mixLocal(rows){
    try {
      var s = JSON.parse(localStorage.getItem("lygo-haven-rally-v1") || "{}");
      var q = JSON.parse(localStorage.getItem("lygo-haven-rally-ledger-q") || "[]");
      (s.rounds || []).forEach(function(r){
        rows.push({
          name: r.name, event: r.score ? "arcade" : (String(r.trackId||"").indexOf("drag")===0 ? "drag" : "heat"),
          track: r.track, craft: r.craft, ms: r.ms, score: r.score || 0, kills: r.kills || 0,
          combo: r.combo || 1, foul: !!r.foul
        });
      });
      (s.arcade && s.arcade.runs || []).forEach(function(r){
        rows.push({ name: r.name, event: "arcade", track: r.track, craft: r.craft, ms: r.ms, score: r.score||0, kills: r.kills||0, combo: r.combo||1 });
      });
      q.forEach(function(r){ rows.push(r); });
    } catch(e) {}
    return rows;
  }
  function dedupe(rows){
    var seen = {}, out = [];
    rows.forEach(function(r){
      var k = [r.name, r.event, r.track, r.ms, r.score, r.date||""].join("|");
      if (seen[k]) return;
      seen[k] = 1;
      out.push(r);
    });
    return out;
  }
  async function pull(){
    var rows = [];
    var src = "this browser";
    for (var i=0;i<FEEDS.length;i++){
      try {
        var r = await fetch(FEEDS[i], { cache: "no-store" });
        if (!r.ok) continue;
        var data = await r.json();
        if (data && Array.isArray(data.rows)) {
          rows = data.rows.slice();
          src = FEEDS[i].replace(/^https?:\/\//,"");
          break;
        }
      } catch(e) {}
    }
    rows = dedupe(mixLocal(rows));
    document.getElementById("srcMeta").textContent = rows.length + " lines · " + src;
    var arcade = rows.filter(function(x){ return x.event === "arcade"; })
      .sort(function(a,b){ return (b.score||0)-(a.score||0); }).slice(0, 20);
    var heats = rows.filter(function(x){ return x.event !== "arcade"; })
      .sort(function(a,b){ return (a.ms||1e12)-(b.ms||1e12); }).slice(0, 40);
    var arcEl = document.getElementById("arcade");
    arcEl.innerHTML = "<h2>Endless arcade</h2>" + (arcade.length ? arcade.map(function(r, i){
      return "<div class='round'><div class='rtop'><b>#"+(i+1)+" · "+(r.score||0)+" pts</b><span>"+fmt(r.ms)+"</span></div>"+
        "<p class='muted'>"+esc(r.name)+" · "+esc(r.track||"Ridge")+" · "+esc(r.craft||"")+" · "+(r.kills||0)+" wrecks · x"+(r.combo||1)+"</p></div>";
    }).join("") : "<p class='muted'>No wreck scores yet. Endless run posts them here.</p>");
    document.getElementById("hall").innerHTML = "<h2>Heats &amp; drag</h2>" + (heats.length ? heats.map(function(r){
      return "<div class='round'><div class='rtop'><b>"+esc(r.track)+"</b><span>"+fmt(r.ms)+"</span></div>"+
        "<p class='muted'>"+esc(r.name)+" · "+esc(r.craft)+(r.foul?" · foul":"")+(r.laps?" · "+r.laps+" laps":"")+"</p></div>";
    }).join("") : "<p class='muted'>No heats yet.</p>");
  }
  pull();
})();
</script>
</body>
</html>
